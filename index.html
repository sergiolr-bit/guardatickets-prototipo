<style>
:root{

  --font:"Atkinson Hyperlegible",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1418; --panel:#17212A; --fg:#EAF0F4; --muted:#9FB0BD; --line:#2A3945; --accent:#5CC0DB; --accent-fg:#06222B; --soft:#1B3039; --hot:#FF8A4C; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1418; --panel:#17212A; --fg:#EAF0F4; --muted:#9FB0BD; --line:#2A3945; --accent:#5CC0DB; --accent-fg:#06222B; --soft:#1B3039; --hot:#FF8A4C; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:28px;line-height:1.2;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.stagewrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.stage{position:relative;width:min(100%,340px);aspect-ratio:422/876;filter:drop-shadow(0 12px 28px rgba(0,0,0,.22))}
.layer{position:absolute;inset:0;transition:opacity .28s ease,transform .28s ease}
.layer.enter{opacity:0}
.layer.enter.fwd{transform:translateX(28px)}
.layer.enter.back{transform:translateX(-28px)}
.layer.leave{opacity:0;pointer-events:none}
.layer.leave.fwd{transform:translateX(-28px)}
.layer.leave.back{transform:translateX(28px)}
.scr{display:block;width:100%;height:100%}
.hs{position:absolute;margin:0;padding:0;border:0;background:transparent;cursor:pointer;border-radius:14px;-webkit-tap-highlight-color:transparent}
.hs:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 6px #16212B}
.hs.round{border-radius:12px}
.show-hot .hs{outline:2px dashed var(--hot);outline-offset:-2px;background:rgba(232,89,12,.14)}
.hint{margin:0;min-height:3em;text-align:center;color:var(--muted);font-size:15px;max-width:34ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:18px;margin:0 0 12px}
.panel + .panel{margin-top:16px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.list button{width:100%;text-align:left;font:inherit;font-size:15px;padding:10px 12px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.list button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.list button:focus-visible,.btn:focus-visible,.chk input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:inherit;font-weight:700;min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:20px;height:20px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--fg)}
ol.steps li{padding-left:4px}
ol.steps b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.layer{transition:none}}
</style></head><body>
<div class="wrap">
  <h1>Prototipo Guardatickets</h1>
  <p class="sub">Recorrido interactivo para guardar un ticket de compra y recibir el aviso antes de que acabe el plazo. Toca los botones del móvil o usa el teclado: Tab para moverte y Intro para pulsar.</p>
  <div class="grid">
    <div class="stagewrap">
      <div class="stage" id="stage" role="region" aria-label="Pantalla del prototipo"></div>
      <p class="hint" id="hint"></p>
    </div>
    <div>
      <section class="panel" aria-labelledby="h-screens">
        <h2 id="h-screens">Pantallas</h2>
        <ul class="list" id="list"></ul>
      </section>
      <section class="panel" aria-labelledby="h-tools">
        <h2 id="h-tools">Ayudas</h2>
        <div class="row">
          <label class="chk"><input type="checkbox" id="showhot"> Mostrar zonas pulsables</label>
          <button class="btn" id="reset" type="button">Volver al inicio</button>
        </div>
      </section>
    </div>
  </div>
</div>

};
const ORDER=['01','02','03','04','05','06','07','08','09','10','11'];
const stage=document.getElementById('stage'),hint=document.getElementById('hint'),live=document.getElementById('live'),list=document.getElementById('list');
let cur=null,timer=null,busy=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pct(v,t){return (v/t*100).toFixed(3)+'%'}
function build(id){
  const s=S[id],layer=document.createElement('div');layer.className='layer';layer.dataset.id=id;
  layer.innerHTML=SVG[id];
  const d=document.createElement('p');d.className='sr';d.textContent='Pantalla '+s.name+'. '+s.desc;layer.appendChild(d);
  s.hs.forEach(h=>{
    const b=document.createElement('button');b.type='button';b.className='hs';b.setAttribute('aria-label',h[4]);
    b.style.left=pct(h[0]+16,422);b.style.top=pct(h[1]+16,876);b.style.width=pct(h[2],422);b.style.height=pct(h[3],876);
    b.addEventListener('click',e=>go(h[5],h[6],e.detail===0));
    layer.appendChild(b);
  });
  return layer;
}
function go(id,anim,viaKey){
  if(busy){busy();}
  clearTimeout(timer);
  const s=S[id],old=cur?stage.querySelector('.layer[data-id="'+cur+'"]:not(.leave)'):null,nw=build(id);
  const dir=anim==='back'?'back':anim==='fwd'?'fwd':'';
  if(old){
    if(!reduce){nw.classList.add('enter');if(dir)nw.classList.add(dir);}
    stage.appendChild(nw);
    old.setAttribute('inert','');old.classList.add('leave');if(dir)old.classList.add(dir);
    const fin=()=>{old.remove();busy=null};
    if(reduce){fin();}else{
      void nw.offsetWidth;nw.classList.remove('enter','fwd','back');
      const t=setTimeout(fin,320);busy=()=>{clearTimeout(t);fin()};
    }
  }else{stage.appendChild(nw);}
  cur=id;hint.textContent=s.hint;live.textContent='Pantalla '+s.name;
  list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id?'true':'false'));
  if(viaKey){const f=nw.querySelector('.hs');if(f)f.focus({preventScroll:true});}
  if(s.auto){timer=setTimeout(()=>go(s.auto[0],'fade',false),s.auto[1]);}
}
ORDER.forEach(id=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.type='button';b.dataset.id=id;b.textContent=id+' '+S[id].name;b.setAttribute('aria-current','false');
  b.addEventListener('click',()=>go(id,'fade',false));li.appendChild(b);list.appendChild(li);
});
document.getElementById('showhot').addEventListener('change',e=>stage.classList.toggle('show-hot',e.target.checked));
document.getElementById('reset').addEventListener('click',()=>go('01','fade',false));
go('01','fade',false);
</script>
